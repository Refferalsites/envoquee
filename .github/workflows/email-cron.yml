name: Email cron
# Review requests (N days after delivered) + consented abandoned-order reminders. Safe when no email provider is set (log only).
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Run email jobs
        env:
          SECRET: ${{ secrets.INDEXNOW_HOOK_SECRET }}
        run: |
          curl -fsS -X POST -H "x-cron-secret: $SECRET" https://envoquee.pages.dev/api/cron
